<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% unless page.title contains site.title %} · {{ site.title }}{% endunless %}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --bg: #e6f4fb;
      --card: #ffffff;
      --text: #1d1b20;
      --muted: #4a4458;
      --accent: #4f4f8f;
      --rule: #c9d7e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1e2127;
        --text: #e6e1e5;
        --muted: #c4c0cc;
        --accent: #b8b8ff;
        --rule: #33373f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 24px; }
    header a { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 20px; }
    main {
      background: var(--card);
      border-radius: 16px;
      padding: 8px 24px 24px;
      margin-top: 16px;
    }
    h1 { font-size: 28px; line-height: 1.25; margin: 20px 0 8px; }
    h2 { font-size: 20px; margin: 28px 0 8px; }
    a { color: var(--accent); }
    ul { padding-left: 22px; }
    li { margin: 4px 0; }
    em { color: var(--muted); }
    footer {
      color: var(--muted);
      font-size: 15px;
      padding-top: 16px;
      padding-bottom: 32px;
    }
    footer a { margin-right: 16px; }
    @media (max-width: 480px) {
      main { padding: 4px 16px 16px; border-radius: 12px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>
{{ content }}
  </main>
  <footer>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/privacy-policy' | relative_url }}">Privacy policy</a>
  </footer>
</body>
</html>
