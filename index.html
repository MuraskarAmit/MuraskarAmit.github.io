<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make Me Smarter</title>
  <meta name="description" content="Daily practice for mental maths, speed tricks, memory techniques, reasoning and general knowledge. Play free in your browser.">
  <link rel="canonical" href="https://makemesmarter.in/play/">
  <!-- The site opens straight into the game (play/). replace() keeps this
       page out of the browser's history, so Back from the game doesn't
       land here and bounce forward again. -->
  <script>location.replace('play/' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=play/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e6f4fb;
      color: #1d1b20;
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: #4f4f8f; }
    @media (prefers-color-scheme: dark) {
      body { background: #14161a; color: #e6e1e5; }
      a { color: #b8b8ff; }
    }
  </style>
</head>
<body>
  <a href="play/">Play Make Me Smarter</a>
</body>
</html>
